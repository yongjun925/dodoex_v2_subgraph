specVersion: 0.0.4
description: Dodoex.io
repository: https://github.com/DODOEX/amm_v2_subgraph
schema:
  file: amm-v2.graphql
dataSources:
  - kind: ethereum/contract
    name: Factory
    network: pharos-atlantic-testnet
    source:
      address: "0x1d416077dC5a9721D4F7A57f2CbCCb0e65d8373E"
      abi: Factory
      startBlock: 28782238
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: Factory/Factory.wasm
      entities:
        - Pair
        - Token
      abis:
        - name: Factory
          file: ../abis/amm-v2/factory.json
        - name: ERC20
          file: ../abis/amm-v2/ERC20.json
        - name: ERC20SymbolBytes
          file: ../abis/amm-v2/ERC20SymbolBytes.json
        - name: ERC20NameBytes
          file: ../abis/amm-v2/ERC20NameBytes.json
      eventHandlers:
        - event: PairCreated(indexed address,indexed address,address,uint256,uint256)
          handler: handleNewPair
  - kind: ethereum/contract
    name: FactoryCurator
    network: pharos-atlantic-testnet
    source:
      address: "0xD6E677064032F755986E779C9e6E7151d2D892bd"
      abi: FactoryCurator
      startBlock: 28782238
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: FactoryCurator/FactoryCurator.wasm
      entities:
        - Pair
        - Token
      abis:
        - name: FactoryCurator
          file: ../abis/amm-v2/factory-curator.json
        - name: Pair
          file: ../abis/amm-v2/pair.json
        - name: ERC20
          file: ../abis/amm-v2/ERC20.json
        - name: ERC20SymbolBytes
          file: ../abis/amm-v2/ERC20SymbolBytes.json
        - name: ERC20NameBytes
          file: ../abis/amm-v2/ERC20NameBytes.json
      eventHandlers:
        - event: PairCreated(indexed address,indexed address,address,uint256,uint256)
          handler: handleNewPair
        - event: PairCreatedCurator(indexed address,indexed address,address,uint256,uint256,address)
          handler: handleNewCuratorPair
templates:
  - kind: ethereum/contract
    name: Pair
    network: pharos-atlantic-testnet
    source:
      abi: Pair
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: templates/Pair/Pair.wasm
      entities:
        - Pair
        - Token
      abis:
        - name: Pair
          file: ../abis/amm-v2/pair.json
        - name: Factory
          file: ../abis/amm-v2/factory.json
        - name: ERC20
          file: ../abis/amm-v2/ERC20.json
        - name: ERC20SymbolBytes
          file: ../abis/amm-v2/ERC20SymbolBytes.json
        - name: ERC20NameBytes
          file: ../abis/amm-v2/ERC20NameBytes.json
      eventHandlers:
        - event: Mint(indexed address,uint256,uint256)
          handler: handleMint
        - event: Burn(indexed address,uint256,uint256,indexed address)
          handler: handleBurn
        - event: Swap(indexed address,uint256,uint256,uint256,uint256,indexed address)
          handler: handleSwap
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: Sync(uint112,uint112)
          handler: handleSync
        - event: FeeRateChange(uint256)
          handler: handleFeeRateChange
        - event: LpMtRatioChange(uint256)
          handler: handleLpMtRatioChange
        - event: LpMtCuratorChange(address)
          handler: handleLpMtCuratorChange
