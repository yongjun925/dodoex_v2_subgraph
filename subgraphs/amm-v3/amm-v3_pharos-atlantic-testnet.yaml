specVersion: 0.0.4
description: Dodoex.io
features:
  - grafting
repository: https://github.com/DODOEX/amm_v3_subgraph
schema:
  file: ./amm-v3.graphql
dataSources:
  - kind: ethereum/contract
    name: Factory
    network: pharos-atlantic-testnet
    source:
      address: '0xB460A66f7147717c7982dA5b03523a34BEe88cC4'
      abi: Factory
      startBlock: 874548
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ../../src/mappings/amm-v3/factory.ts
      entities:
        - Pool
        - Token
      abis:
        - name: Factory
          file: ../../abis/amm-v3/factory.json
        - name: ERC20
          file: ../../abis/amm-v3/ERC20.json
        - name: ERC20SymbolBytes
          file: ../../abis/amm-v3/ERC20SymbolBytes.json
        - name: ERC20NameBytes
          file: ../../abis/amm-v3/ERC20NameBytes.json
        - name: Pool
          file: ../../abis/amm-v3/pool.json
        - name: NonfungiblePositionManager
          file: ../../abis/amm-v3/NonfungiblePositionManager.json 
      eventHandlers:
        - event: PoolCreated(indexed address,indexed address,indexed uint24,int24,address)
          handler: handlePoolCreated
  - kind: ethereum/contract
    name: NonfungiblePositionManager
    network: pharos-atlantic-testnet
    source:
      address: '0x1c430d84DD6185b1Ea2d4693e0033799d193542f'
      abi: NonfungiblePositionManager
      startBlock: 874548
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ../../src/mappings/amm-v3/nonfungiblePositionManager.ts
      entities:
        - Pool
        - Token
      abis:
        - name: Factory
          file: ../../abis/amm-v3/factory.json
        - name: ERC20
          file: ../../abis/amm-v3/ERC20.json
        - name: ERC20SymbolBytes
          file: ../../abis/amm-v3/ERC20SymbolBytes.json
        - name: ERC20NameBytes
          file: ../../abis/amm-v3/ERC20NameBytes.json
        - name: Pool
          file: ../../abis/amm-v3/pool.json
        - name: NonfungiblePositionManager
          file: ../../abis/amm-v3/NonfungiblePositionManager.json          
      eventHandlers:
        - event: IncreaseLiquidity(indexed uint256,uint128,uint256,uint256)
          handler: handleIncreaseLiquidity
        - event: DecreaseLiquidity(indexed uint256,uint128,uint256,uint256)
          handler: handleDecreaseLiquidity
templates:
  - kind: ethereum/contract
    name: Pool
    network: pharos-atlantic-testnet
    source:
      abi: Pool
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ../../src/mappings/amm-v3/pool/index.ts
      entities:
        - Pool
        - Token
      abis:
        - name: Factory
          file: ../../abis/amm-v3/factory.json
        - name: ERC20
          file: ../../abis/amm-v3/ERC20.json
        - name: ERC20SymbolBytes
          file: ../../abis/amm-v3/ERC20SymbolBytes.json
        - name: ERC20NameBytes
          file: ../../abis/amm-v3/ERC20NameBytes.json
        - name: Pool
          file: ../../abis/amm-v3/pool.json
        - name: NonfungiblePositionManager
          file: ../../abis/amm-v3/NonfungiblePositionManager.json         
      eventHandlers:
        - event: Initialize(uint160,int24)
          handler: handleInitialize
        - event: Swap(indexed address,indexed address,int256,int256,uint160,uint128,int24)
          handler: handleSwap
        - event: Mint(address,indexed address,indexed int24,indexed
            int24,uint128,uint256,uint256)
          handler: handleMint
        - event: Burn(indexed address,indexed int24,indexed int24,uint128,uint256,uint256)
          handler: handleBurn
        - event: Collect(indexed address,address,indexed int24,indexed
            int24,uint128,uint128)
          handler: handleCollect
